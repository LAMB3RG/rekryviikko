<script>
"use strict";
(() => {
  // dist/logic.mjs
  var COMMANDS = Object.freeze({ F: { label: "Eteen", icon: "forward" }, L: { label: "Vasen", icon: "left" }, R: { label: "Oikea", icon: "right" } });
  var ROUND_MS = 3e5;
  var STAGES = Object.freeze([{ id: "robot", name: "Koodaa", icon: "code", duration: 9e4 }, { id: "security", name: "Suojaa", icon: "shield", duration: 6e4 }, { id: "assembly", name: "Kokoa", icon: "chip", duration: 8e4 }, { id: "roles", name: "Yhdistä", icon: "cable", duration: 5e4 }]);
  var BOARD = Object.freeze({ cols: 6, rows: 5, start: Object.freeze({ x: 0, y: 3, dir: 0 }), goal: Object.freeze({ x: 3, y: 1 }), obstacles: Object.freeze([[1, 2], [3, 3], [2, 0], [4, 1], [3, 2]]) });
  var SOLUTION = Object.freeze(["F", "F", "L", "F", "F", "R", "F"]);
  var DIRECTIONS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  function stepRobot(pose, command, board = BOARD) {
    if (!COMMANDS[command]) throw new Error("Tuntematon komento");
    const next = { x: pose.x, y: pose.y, dir: pose.dir };
    if (command === "L") next.dir = (next.dir + 3) % 4;
    if (command === "R") next.dir = (next.dir + 1) % 4;
    if (command === "F") {
      const [dx, dy] = DIRECTIONS[next.dir];
      next.x += dx;
      next.y += dy;
      const reason = next.x < 0 || next.y < 0 || next.x >= board.cols || next.y >= board.rows ? "boundary" : board.obstacles.some(([x, y]) => x === next.x && y === next.y) ? "obstacle" : board.path && !board.path.some(({ x, y }) => x === next.x && y === next.y) ? "hazard" : null;
      if (reason) return { pose: { ...pose }, blocked: true, reached: false, blockedAt: { x: next.x, y: next.y }, reason };
    }
    return { pose: next, blocked: false, reached: next.x === board.goal.x && next.y === board.goal.y };
  }

        const b = $("hotspot-" + slotId);
        b?.classList.add("wrong");
        setTimeout(() => b?.classList.remove("wrong"), 400);
        this.announce(this.status);
        return false;
      }
      this.installFocus ?? (this.installFocus = {});
      this.installFocus[partId] = options.keyboard === true;
      this.scene.state.selectedPart = null;
      this.selectedPart = null;
      this.status = PARTS.find((p) => p.id === partId).short + " asentuu…";
      this.tone("click");
      this.renderPanel();
      this.renderHotspots();
      return true;
    }
  };
  if (typeof document !== "undefined") new Game();
})();

</script>

<script id="idle-return-script">
(() => {
  const idleLimit = 60_000;
  let lastActivity = Date.now();
  let timeoutId;

  function checkIdle() {
    clearTimeout(timeoutId);
    const remaining = idleLimit - (Date.now() - lastActivity);
    if (remaining <= 0) {
      window.location.assign('index.html');
      return;
    }
    timeoutId = setTimeout(checkIdle, remaining);
  }

  function recordActivity(event) {
    if (!event.isTrusted) return;
    lastActivity = Date.now();
    checkIdle();
  }

  // Capture activity even when a game control stops event propagation.
  for (const type of ['keydown', 'keyup', 'pointerdown', 'pointerup',
    'pointermove', 'mousemove', 'mousedown', 'mouseup', 'wheel',
    'touchstart', 'touchmove']) {
    window.addEventListener(type, recordActivity, { capture: true, passive: true });
  }
  // Recheck the deadline when a throttled or suspended tab becomes visible.
  document.addEventListener('visibilitychange', checkIdle);
  window.addEventListener('pageshow', checkIdle);
  checkIdle();
})();
</script>
